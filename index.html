<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:linear-gradient(135deg,#3B1E63 0%,#6B3FA0 55%,#1E1430 100%);
    color:#fff;
    font-family:"Assistant",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
    display:flex;align-items:center;justify-content:center;
    text-align:center;padding:24px;position:relative;overflow:hidden;
  }
  /* Two soft highlights sit behind the text and never under it, so contrast
     stays well above the accessibility threshold. */
  .glow{position:absolute;border-radius:50%;filter:blur(70px);pointer-events:none}
  .g1{width:420px;height:420px;background:rgba(180,151,224,.30);top:-140px;right:-90px}
  .g2{width:360px;height:360px;background:rgba(0,184,217,.16);bottom:-150px;left:-70px}
  .w{position:relative;z-index:1;max-width:560px}
  h1{font-family:"Rubik",sans-serif;font-weight:800;font-size:42px;margin:0;letter-spacing:-.5px;line-height:1.15}
  .a{color:#F0C05A}
  .sub{font-family:"Rubik",sans-serif;font-weight:500;font-size:20px;color:#F0C05A;margin:14px 0 0;line-height:1.5}
  p{font-size:17px;line-height:1.75;color:rgba(255,255,255,.85);margin:18px 0 0}
  .tag{display:inline-block;margin-top:28px;border:1px solid rgba(255,255,255,.35);
    border-radius:999px;padding:10px 26px;font-size:15px;font-weight:600;color:#fff}
  .contact{margin-top:30px;font-size:15px;color:rgba(255,255,255,.7)}
  .contact a{color:#F0C05A;text-decoration:none}
  .contact a:hover,.contact a:focus{text-decoration:underline}
  a:focus-visible{outline:3px solid #F0C05A;outline-offset:3px;border-radius:4px}
  @media (max-width:520px){h1{font-size:32px}.sub{font-size:17px}p{font-size:16px}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>
  <div class="glow g1" aria-hidden="true"></div>
  <div class="glow g2" aria-hidden="true"></div>
